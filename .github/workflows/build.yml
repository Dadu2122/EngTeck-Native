name: Build EngTeck APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Decode debug keystore
        # The committed keystore is base64 TEXT (app/debug.keystore.base64) â€”
        # phone-browser uploads can silently corrupt raw binary files, so the
        # actual binary debug.keystore Gradle needs is rebuilt fresh here on
        # every run instead of being committed directly.
        run: base64 -d app/debug.keystore.base64 > app/debug.keystore

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EngTeck-debug-apk
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
